[project]
name = "rag-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
    "accelerate",
    "pydantic",
    "fire",
    "tqdm",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.flake8]
max-line-length = 100