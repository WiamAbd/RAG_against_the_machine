[project]
name = "rag-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
    "accelerate",
    "pydantic",
    "fire",
    "tqdm",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.flake8]
max-line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true